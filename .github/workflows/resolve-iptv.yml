name: Resolve IPTV real URLs

# Fetch pianha/IPTV-Unicom IPTV.m3u, follow the 302 chain of every
# /play/<id>.m3u8 entry the way a browser does, replace each entry with
# the final real m3u8 address, and commit the result as IPTV-real.m3u
# in this repo (pianha/devall).
#
# The real addresses carry timestamps/tokens and expire, so this runs
# on a schedule: roughly every 10 days is enough.

on:
  workflow_dispatch:
  schedule:
    # 1st, 11th and 21st of each month, 02:20 UTC (10:20 Beijing)
    - cron: "20 2 1,11,21 * *"

permissions:
  contents: write

concurrency:
  group: resolve-iptv
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve real URLs
        run: python3 resolve.py

      - name: Commit result if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-real.m3u
          if git diff --cached --quiet; then
            echo "No changes, nothing to commit."
          else
            git commit -m "Update IPTV-real.m3u ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
